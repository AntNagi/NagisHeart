# 运行时可调参数。凡是「数值」，都应该在这里，不在代码里。
# 依据：V4 §9（Context 预算）/ §8.3（检索权重）/ §11.2（容量）。

context:
  # 总预算是硬约束。超出按 priority 升序丢弃，且必须记日志（V4 §9）。
  totalTokenBudget: 20000
  safetyMarginRatio: 0.10        # token 为估算值，留 10% 余量

  blocks:                        # 装配顺序见 V4 §9
    personalityCore:   1500
    speechStyle:        800
    styleAnchors:      1800      # 跑弱模型时调高，这是防 OOC 的主力
    canonTimeline:      600
    userRelationship:   300      # 渲染成自然语言，不给数值
    behaviorAndScene:  1500
    canonMemory:       2000
    liveMemory:        2500
    conversationWindow: 6000
    personalityRecap:   400      # 尾部锚，对抗长上下文人格漂移

  # token 估算系数。8/23 用 countTokens 离线标定后回填（V4 §9 待办）。
  tokenEstimate:
    cjkRatio: 0.561              # 【已验证】2026-08-21 实测：personality.base+speech 2054 字 = 1153 token
    latinRatio: TBD_8_23
    recalibrateIfDriftOver: 0.15

retrieval:
  # 混合排序权重。属可测配置，不在 Graph 节点硬编码（V4 §8.3）。
  #
  # ⚠ 2026-08-22 改写（NRH-20260822-023，Ant 裁 A）。
  # 此前这里写的是 cosine 0.60 / recency 0.25 / emotionIntensity 0.15，
  # 与代码实际口径**维度都不一样**，且从未被任何代码读过——
  # 配置存在而代码不读，比没有配置更糟，它让人以为改配置有用。
  # 现已改成代码实际在用的五项，并真正接线。**数值一位未动，凪的行为不变。**
  #
  # emotionIntensity 被移除：记忆结构里根本没有「情绪强度」这个字段。
  # 要做它是给凪加一个新脾气（偏向记住情绪浓的事），属人设决定而非配置同步，
  # 已改列为独立需求，待豆包可用、Ant 实际体验一轮后再定。
  #
  # 五项含义（凪每轮决定「想起哪几条事」时的权重）：
  #   semantic   跟你这句话有多像（向量余弦与词面命中取较大者）
  #   recency    多久之前的事（canon 固定 0.5，live 按 30 天半衰）
  #   salience   这件事有多重要
  #   confidence 这条记忆有多可信（canon 为 1.0，模型抽取的为 0.6）
  #   canonBoost 剧情事实的固定加分。**是加项不是乘数**，不参与归一
  weights:
    semantic: 0.52
    recency: 0.16
    salience: 0.16
    confidence: 0.16
    canonBoost: 0.08
  topK:
    canon: 8
    live: 8
    styleAnchors: 8
  # 相关性下限（F32）。低于此分的记忆不返回。
  #
  # 0 = 关闭，永远塞满 topK 条——**这是当前默认，也是 F32 描述的问题**：
  # 库里没有相关记忆时检索仍返回 8 条噪声，凪会答非所问式地扯到剧情里去。
  #
  # 实测参考（2026-08-22，gemini-embedding-001，51 条 canon）：
  #   强命中「世界杯决赛那个关键进球」-> dream_match 0.922 / wc_keygoal 0.920
  #   正确命中「我们住的那个家」      -> dream_home  0.901
  #   无相关记忆「你和凛的关系怎么样」-> 基线噪声   0.899
  # 强命中与噪声只差约 0.023，所以这个值很敏感：
  # 调太高凪会失忆（比记错更糟），调太低等于没开。0.90 是建议的起点。
  #
  # 换 embedding 模型后这个值**必须重新标定**——不同模型的余弦分布不同。
  minScore: 0

guard:
  maxRetries: 1                  # 硬规则不过 → revise_context → 重生成，最多一次
  oocScoreThreshold: TBD_8_25    # soft_judge 阈值，按实测拦截率标定
  # 首字延迟量测门槛见 V4 §6.1：≲3s 不动；≳6s 评估混合流

relationship:
  # 单轮变化上限，防止一句话把关系拉满（V4 §13.1「单轮变化受限」）
  maxDeltaPerTurn: 3

  # ── UserRelationship 初值（Q19 裁决，2026-08-21）────────────────
  # 继承 CanonWorld 的终局关系，而不是从零。
  # 依据：D1 时间锚是通关之后 + Q16「按现有 Ant 来」。
  #       从零会自相矛盾——凪记得和你走完全程，却对你像陌生人。
  seedFromCanon: true

  seed:
    # 取值依据 relationship/baseline.true_end.md 的关系质感：
    #   「他愿意在你面前露出疲惫，但仍然不会主动说想你。」
    #   那是「打完仗回来」，不是热恋顶点。故不取满。
    trust: 85        # 他让你看见疲惫
    intimacy: 70     # 但不会主动说想你
    friction: 25     # ⚠ 不为零。见下

    # friction 为什么不能是 0：
    #   1. 剧本母版是 V17 **RelationshipFriction Calibrated**——
    #      摩擦是被刻意校准进去的，不是需要消除的瑕疵。
    #   2. Nagi Bible §7.5.1「关系成本外包」是**永久特质**，不因通关消失。
    #   3. friction=0 等于宣告「关系已经完美」，而 §15.7
    #      「所有缺点都好可爱」正是要防这个——他的不作为必须持续有成本。
    #   4. 立项书验收含「关系连续性」。变量顶满就无法观测变化，
    #      那个 Eval 维度会变成空的。

  # ⚠ 前提条件（比数值更重要）：
  #   继承高亲密度的前提是 canon memory 烘焙扎实。
  #   初始状态下 live 记忆是空的；若 canon 检索不出具体的事，
  #   凪会表现成「说得亲密却什么都想不起来」——最像恋爱机器人的失真。
  #   他必须能说出「上次在曼城那间公寓」这类具体的东西，亲密才立得住。
  #   ⇒ bake-canon 未做扎实之前，继承来的亲密度是空头支票。
  requiresCanonMemory: true

  # 保留：将来若要做「从零认识」模式（给不熟悉剧情的使用者），
  # 不是改初值就行，需要一套 canon 屏蔽机制（凪不得提对方没经历过的事）。
  # 架构上不要把 canon 写死成永远可见。见 OPEN_QUESTIONS 的后续项。
  canonMasking: not_implemented

capacity:
  # 首发按最多 50 个用户身份设计，不等于 50 并发（V4 §11.2 / B5）
  maxUserIdentities: 50
  perUserMemoryCap: TBD_8_27
  rateLimitPerMinute: TBD_8_27   # 部署平台确定后压测，不凭空填
