# Provider 配置。业务代码只认 main / aux / embedding 三个能力位，不认厂商与模型名。
# 依据：V4 §10 / D7；国产优先见 D8（NRH-20260820-019）。
#
# ⚠ 本文件不含任何 API key。BYOK：使用者的 key 随请求经 X-LLM-Key 透传（V4 §10）。
# ⚠ vendor 必须来自本白名单，使用者不能提交任意 endpoint。

llm:
  # 首版只实现一个国产 Provider（火山方舟 Ark，2026-08-22 接入并实测）。
  active: volcengine_ark

  vendors:
    # 已接入并实测。aux 需关闭深度思考，见下。
    volcengine_ark:
      endpoint: "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
      models:
        main: doubao-seed-character-260628
        aux: doubao-seed-2-0-mini-260215
      # aux 的 thinking:disabled 由 provider-config.ts 按模型名前缀注入。
      # 实测：不关思考时抽 2 条事实要 635 token / 6.2s，关掉后 41 token / 0.9s，结果一致。
      # main 不关——凪的回复质量优先，且 NRH-20260821-2037 的对抗用例在默认设置下标定。
      # 各家差异由 Adapter 内部吸收，业务不感知（V4 §10）
      extraHeaders: {}

    # ── 调试档：Gemini 免费额度 ────────────────────────────────────
    # 用途：**开发期零成本调试**，不改变 NRH-20260820-019「国产模型优先」的首发选型。
    # Google 提供 OpenAI 兼容端点，故本仓库的 OpenAICompatibleProvider 无需改代码。
    # ⚠ 需要代理：Node 的 fetch 不读 HTTP(S)_PROXY，已在 package.json 脚本加
    #    --use-env-proxy（Node 内置，零依赖）。curl 能通不代表 Node 能通。
    google_gemini:
      endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
      models:
        main: gemini-2.5-flash
        aux: gemini-2.5-flash-lite
      extraHeaders: {}

    # 保留配置位，不在首版实现（V4 §10「不在跑通前并行开发」）
    anthropic:
      endpoint: https://api.anthropic.com/v1
      models:
        main: claude-opus-5
        aux: claude-haiku-4-5
      extraHeaders: {}

embedding:
  # ⚠ 铁律：更换聊天 LLM 不得自动更换 embedding 模型（V4 §8.2）。
  # 向量必须与查询同模型同版本，混合向量空间检索是静默错误。
  active: volcengine_ark
  vendors:
    volcengine_ark:
      endpoint: "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
      modelId: TBD
      dimension: TBD
      version: 1
