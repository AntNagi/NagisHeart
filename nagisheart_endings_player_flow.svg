<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500">
  <defs>
    <style>
      .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .kicker { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; letter-spacing: 4px; fill: rgba(215,190,134,0.82); }
      .title { font: 400 42px "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif; fill: rgba(247,249,252,0.96); }
      .sub { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: rgba(201,209,220,0.74); }
      .node-title { font: 400 27px "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif; fill: rgba(247,243,234,0.95); }
      .node-body { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: rgba(232,238,246,0.74); }
      .node-small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: rgba(201,209,220,0.62); }
      .tag { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; letter-spacing: 2.2px; fill: rgba(215,190,134,0.86); }
      .ending-title { font: 400 30px "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif; fill: rgba(247,249,252,0.95); }
      .ending-body { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: rgba(247,249,252,0.72); }
      .glass { fill: url(#glass); stroke: rgba(255,255,255,0.10); stroke-width: 1.5; filter: url(#shadow); }
      .glass-gold { fill: url(#glassGold); stroke: rgba(215,190,134,0.30); stroke-width: 1.5; filter: url(#shadow); }
      .route { stroke: rgba(215,190,134,0.76); stroke-width: 4; fill: none; marker-end: url(#arrowGold); }
      .route-soft { stroke: rgba(154,168,186,0.26); stroke-width: 3; fill: none; marker-end: url(#arrowSoft); }
      .dot { fill: #091522; stroke: rgba(215,190,134,0.86); stroke-width: 2; }
      .dot-inner { fill: rgba(215,190,134,0.88); }
      .diamond { fill: rgba(215,190,134,0.76); }
      .rule { stroke: url(#rule); stroke-width: 1.5; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="0.42" stop-color="#0B1422"/>
      <stop offset="0.72" stop-color="#0E1726"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="27%" r="56%">
      <stop offset="0" stop-color="rgba(215,190,134,0.10)"/>
      <stop offset="0.48" stop-color="rgba(16,24,39,0.08)"/>
      <stop offset="1" stop-color="rgba(16,24,39,0)"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.075)"/>
      <stop offset="0.52" stop-color="rgba(15,27,44,0.60)"/>
      <stop offset="1" stop-color="rgba(11,22,38,0.46)"/>
    </linearGradient>
    <linearGradient id="glassGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(215,190,134,0.18)"/>
      <stop offset="0.45" stop-color="rgba(16,24,39,0.58)"/>
      <stop offset="1" stop-color="rgba(16,24,39,0.78)"/>
    </linearGradient>
    <linearGradient id="endingTrue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(215,190,134,0.20)"/>
      <stop offset="1" stop-color="rgba(16,24,39,0.78)"/>
    </linearGradient>
    <linearGradient id="endingGood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(201,168,92,0.18)"/>
      <stop offset="1" stop-color="rgba(16,24,39,0.78)"/>
    </linearGradient>
    <linearGradient id="endingNormal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(220,226,234,0.14)"/>
      <stop offset="1" stop-color="rgba(16,24,39,0.78)"/>
    </linearGradient>
    <linearGradient id="endingBad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(151,178,215,0.18)"/>
      <stop offset="1" stop-color="rgba(16,24,39,0.78)"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(215,190,134,0)"/>
      <stop offset="0.5" stop-color="rgba(215,190,134,0.42)"/>
      <stop offset="1" stop-color="rgba(215,190,134,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="rgba(215,190,134,0.76)"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="rgba(154,168,186,0.38)"/>
    </marker>
  </defs>

  <rect width="1400" height="1500" fill="url(#bg)"/>
  <rect width="1400" height="1500" fill="url(#bgGlow)"/>
  <rect width="1400" height="1500" fill="rgba(9,14,24,0.22)"/>

  <text x="700" y="78" text-anchor="middle" class="kicker">ENDING ROUTE MAP</text>
  <line x1="456" y1="106" x2="944" y2="106" class="rule"/>
  <text x="700" y="162" text-anchor="middle" class="title">《Nagi’s Heart》全结局路线</text>
  <text x="700" y="203" text-anchor="middle" class="sub">先看第六部分线，再看第八部终局选择；M 线出 TRUE / GOOD，J 线出 NORMAL / BAD</text>

  <path d="M718 255 L718 312" class="route"/>
  <circle cx="718" cy="252" r="11" class="dot"/>
  <circle cx="718" cy="252" r="3.8" class="dot-inner"/>

  <polygon points="402,272 1004,272 1004,392 986,410 384,410 384,290" class="glass-gold"/>
  <text x="694" y="320" text-anchor="middle" class="tag">CHAPTER 01-06</text>
  <text x="694" y="358" text-anchor="middle" class="node-title">前期累计</text>
  <text x="694" y="388" text-anchor="middle" class="node-body">理解 / 自主 / 控制 / 距离 / 依赖，会决定关系底色</text>

  <path d="M700 410 L700 478" class="route"/>
  <polygon points="475,478 925,478 925,592 907,610 457,610 457,496" class="glass"/>
  <text x="700" y="523" text-anchor="middle" class="tag">ROUTER</text>
  <text x="700" y="560" text-anchor="middle" class="node-title">第六部隐藏分流</text>
  <text x="700" y="588" text-anchor="middle" class="node-body">route_mj_hidden 判定 M 线或 J 线</text>

  <path d="M457 610 C310 680 238 730 238 812" class="route"/>
  <path d="M925 610 C1088 680 1162 730 1162 812" class="route-soft"/>

  <polygon points="88,812 506,812 506,990 488,1008 70,1008 70,830" class="glass"/>
  <text x="288" y="862" text-anchor="middle" class="tag">M ROUTE</text>
  <text x="288" y="902" text-anchor="middle" class="node-title">理解 / 自主</text>
  <text x="288" y="936" text-anchor="middle" class="node-body">尊重 Nagi 自己决定</text>
  <text x="288" y="965" text-anchor="middle" class="node-small">i、egoHold 高；control、D 低</text>
  <rect x="195" y="980" width="186" height="2" fill="rgba(215,190,134,0.42)"/>

  <polygon points="914,812 1332,812 1332,990 1314,1008 896,1008 896,830" class="glass"/>
  <text x="1114" y="862" text-anchor="middle" class="tag">J ROUTE</text>
  <text x="1114" y="902" text-anchor="middle" class="node-title">管理 / 依赖</text>
  <text x="1114" y="936" text-anchor="middle" class="node-body">替他安排、保护或过滤世界</text>
  <text x="1114" y="965" text-anchor="middle" class="node-small">control、habitDepend、D 上升</text>
  <rect x="1021" y="980" width="186" height="2" fill="rgba(215,190,134,0.26)"/>

  <path d="M288 1008 C288 1078 420 1098 520 1130" class="route"/>
  <path d="M1114 1008 C1114 1078 980 1098 880 1130" class="route-soft"/>

  <polygon points="488,1130 912,1130 912,1242 894,1260 470,1260 470,1148" class="glass"/>
  <text x="700" y="1174" text-anchor="middle" class="tag">ROUTE_LOVE_HIDDEN</text>
  <text x="700" y="1210" text-anchor="middle" class="node-title">第七部状态读取</text>
  <text x="700" y="1237" text-anchor="middle" class="node-body">确认 Dream 资格，或进入 Stay / Bad 分流</text>

  <path d="M594 1260 C478 1302 384 1322 274 1360" class="route"/>
  <path d="M658 1260 C642 1298 625 1325 600 1360" class="route"/>
  <path d="M746 1260 C794 1300 844 1326 908 1360" class="route-soft"/>
  <path d="M812 1260 C938 1300 1054 1328 1185 1360" class="route-soft"/>

  <polygon points="78,1360 348,1360 348,1460 332,1476 62,1476 62,1376" fill="url(#endingTrue)" stroke="rgba(215,190,134,0.42)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="205" y="1398" text-anchor="middle" class="tag">TRUE</text>
  <text x="205" y="1432" text-anchor="middle" class="ending-title">TRUE END</text>
  <text x="205" y="1458" text-anchor="middle" class="ending-body">保留自己 + 条件完整</text>

  <polygon points="428,1360 698,1360 698,1460 682,1476 412,1476 412,1376" fill="url(#endingGood)" stroke="rgba(215,190,134,0.30)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="555" y="1398" text-anchor="middle" class="tag">GOOD</text>
  <text x="555" y="1432" text-anchor="middle" class="ending-title">GOOD END</text>
  <text x="555" y="1458" text-anchor="middle" class="ending-body">Dream，但 TRUE 不完整</text>

  <polygon points="778,1360 1048,1360 1048,1460 1032,1476 762,1476 762,1376" fill="url(#endingNormal)" stroke="rgba(220,226,234,0.22)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="905" y="1398" text-anchor="middle" class="tag">NORMAL</text>
  <text x="905" y="1432" text-anchor="middle" class="ending-title">NORMAL END</text>
  <text x="905" y="1458" text-anchor="middle" class="ending-body">Stay，未触发 badLock</text>

  <polygon points="1128,1360 1390,1360 1390,1460 1374,1476 1112,1476 1112,1376" fill="url(#endingBad)" stroke="rgba(151,178,215,0.30)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1248" y="1398" text-anchor="middle" class="tag">BAD</text>
  <text x="1248" y="1432" text-anchor="middle" class="ending-title">BAD END</text>
  <text x="1248" y="1458" text-anchor="middle" class="ending-body">badLock 锁定</text>

  <g transform="translate(650 1322)">
    <rect x="-84" y="-20" width="168" height="40" fill="rgba(10,21,35,0.42)" stroke="rgba(215,190,134,0.18)"/>
    <text x="0" y="5" text-anchor="middle" class="tag" style="font-size:12px;">DREAM</text>
  </g>
  <g transform="translate(988 1322)">
    <rect x="-92" y="-20" width="184" height="40" fill="rgba(10,21,35,0.42)" stroke="rgba(215,190,134,0.14)"/>
    <text x="0" y="5" text-anchor="middle" class="tag" style="font-size:12px; fill:rgba(201,209,220,0.66);">STAY / BAD</text>
  </g>

  <g transform="translate(82 238)">
    <polygon points="0,10 10,0 20,10 10,20" class="diamond"/>
    <text x="34" y="16" class="node-small">玩家读法：路线先于结局；不用先背全部变量。</text>
  </g>
</svg>
